<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>議会録サーチライト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__text">
        <p class="eyebrow">議事録検索を、もっとシンプルに</p>
        <h1>議会録サーチライト</h1>
        <p>
          キーワード・発言者・日付で横断検索し、会議の文脈を素早く把握。
          余計な画面遷移は不要です。
        </p>
        <div class="hero__actions">
          <button class="btn primary" id="focusKeyword">キーワードから検索</button>
          <button class="btn ghost" id="resetFilters">条件をクリア</button>
        </div>
      </div>
      <div class="hero__panel">
        <div class="stat">
          <span class="stat__label">掲載会議</span>
          <strong id="meetingCount">0</strong>
        </div>
        <div class="stat">
          <span class="stat__label">収録発言</span>
          <strong id="speechCount">0</strong>
        </div>
        <p class="hero__note">デモデータで体験できます。</p>
      </div>
    </header>

    <main class="layout">
      <section class="search">
        <header class="section-header">
          <div>
            <p class="eyebrow">検索条件</p>
            <h2>シンプル検索</h2>
            <p class="muted">必要な軸だけで絞り込み。すべての条件は即時反映されます。</p>
          </div>
          <div class="hint">日付・委員会・発言者でクロス検索できます。</div>
        </header>

        <form id="searchForm" class="search__form">
          <label class="field">
            <span>キーワード</span>
            <div class="field__inline">
              <input
                type="text"
                id="keyword"
                name="keyword"
                placeholder="例: 防災訓練 / 予算 / 学校"
              />
              <button class="btn secondary" type="button" id="quickBudget">予算</button>
              <button class="btn secondary" type="button" id="quickSafety">防災</button>
            </div>
          </label>

          <div class="field grid-2">
            <label>
              <span>発言者</span>
              <input
                type="text"
                id="speaker"
                name="speaker"
                placeholder="議員・首長名など"
              />
            </label>
            <label>
              <span>委員会・会議</span>
              <select id="committee" name="committee">
                <option value="">すべて</option>
              </select>
            </label>
          </div>

          <div class="field grid-2">
            <label>
              <span>開始日</span>
              <input type="date" id="dateFrom" name="dateFrom" />
            </label>
            <label>
              <span>終了日</span>
              <input type="date" id="dateTo" name="dateTo" />
            </label>
          </div>

          <div class="field grid-2">
            <label>
              <span>並び替え</span>
              <select id="sort" name="sort">
                <option value="desc">新しい順</option>
                <option value="asc">古い順</option>
              </select>
            </label>
            <label class="checkbox">
              <input type="checkbox" id="onlyHighlights" /> 重要タグを含むものだけ
            </label>
          </div>

          <div class="action-row">
            <button class="btn primary" type="submit">検索する</button>
            <span class="muted">条件は自動で保存されます。</span>
          </div>
        </form>
      </section>

      <section class="results">
        <header class="section-header">
          <div>
            <p class="eyebrow">検索結果</p>
            <h2><span id="resultCount">0</span> 件ヒット</h2>
            <p class="muted">クリックすると右側で全文要約を確認できます。</p>
          </div>
          <div class="chips" id="activeFilters"></div>
        </header>

        <div id="resultList" class="result-list"></div>
      </section>

      <aside class="detail" id="detailPanel">
        <p class="eyebrow">内容プレビュー</p>
        <h3 id="detailTitle">検索結果から発言を選択してください</h3>
        <p class="muted" id="detailMeta"></p>
        <div class="tag-row" id="detailTags"></div>
        <p id="detailSummary" class="detail__summary"></p>
        <div class="detail__actions">
          <a id="detailLink" class="btn primary" href="#" target="_blank" rel="noopener">原文を開く</a>
          <button class="btn ghost" id="copySummary">サマリーをコピー</button>
        </div>
      </aside>
    </main>

    <footer class="footer">
      <p>シンプルな議会録検索デモ。余計なページ遷移なしで議事録にアクセスできます。</p>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
